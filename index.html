:root{color-scheme:dark;--green:#46ff39;--pale:#def5df;--line:#82988954;--ink:#080e0c;font:11px ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--pale)}
main{height:100vh;height:100dvh;display:grid}
.scene{position:relative;overflow:hidden;isolation:isolate;background:#111f26;touch-action:none;cursor:crosshair}
.scene::before,.scene::after{content:"";position:absolute;inset:0;pointer-events:none}
.scene::before{background:url("materiales/lost-city.webp") 22% 47% / cover}
.scene::after{z-index:1;background:linear-gradient(180deg,#03090724,transparent 25%,transparent 74%,#0309074d),radial-gradient(ellipse at center,transparent 45%,#0206051c 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#trail{pointer-events:none;z-index:3}
.brand{position:absolute;z-index:4;bottom:max(7%,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:grid;place-items:center;padding:6px;border:0;background:none;cursor:pointer}
.brand{color:var(--green);font:400 clamp(11.5px,2.2vw,28.5px)/1 Nepantla,Bahnschrift,sans-serif;white-space:nowrap;text-decoration:none;text-shadow:0 2px 10px #071008}
.brand:hover{text-shadow:0 0 12px #46ff3970}
.brand:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#notice{position:absolute;z-index:2;inset:auto 18px 14px;margin:0;padding:8px;background:#07100dde;width:fit-content}
